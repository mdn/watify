name: publish-npm

on:
  workflow_run:
    workflows: [build]
    types: [completed]

permissions:
  id-token: write # OIDC for npm Trusted Publishing

jobs:
  on-success:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup rust
        uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97

      - name: Install wasm-pack
        run: |
          VERSION=$(cargo metadata --manifest-path tools/Cargo.toml --format-version 1 --no-deps \
            | jq -r '.packages[0].dependencies[] | select(.name=="wasm-pack") | .req' \
            | sed 's/^=//')
          cargo install wasm-pack --version "$VERSION" --locked

      - name: Build
        run: wasm-pack build --release --target web --scope mdn

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          registry-url: "https://registry.npmjs.org/"
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Publish
        working-directory: ./pkg
        run: npm publish --access public --provenance
