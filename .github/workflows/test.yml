name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions: {} # No GITHUB_TOKEN permissions, as we don't use it.

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup rust
        uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97
        with:
          components: rustfmt, clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Run fmt
        run: cargo fmt -- --check

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose --workspace --all-targets --no-fail-fast

      - name: Run clippy
        run: cargo clippy --all-features --workspace -- -Dwarnings

  npm-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup rust
        uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97
        with:
          components: rustfmt, clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install wasm-pack
        run: |
          VERSION=$(cargo metadata --manifest-path tools/Cargo.toml --format-version 1 --no-deps \
            | jq -r '.packages[0].dependencies[] | select(.name=="wasm-pack") | .req' \
            | sed 's/^=//')
          cargo install wasm-pack --version "$VERSION" --locked

      - name: Run wasm-pack
        run: wasm-pack build --release --target web --scope mdn

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          registry-url: "https://registry.npmjs.org/"
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Bump version (prerelease)
        working-directory: ./pkg
        run: npm version prerelease

      - name: Publish (dry-run)
        working-directory: ./pkg
        run: npm publish --dry-run --access public --provenance --tag test
